name: Development checks

on:
  pull_request:
  push:
    branches:
      - development

jobs:
  userscript:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Use package version for prerelease build
        run: echo "GIT_TAG_NAME=v$(node -p 'require("./package.json").version')" >> "$GITHUB_ENV"
      - name: Check floofgens.net targeting and API request policy
        run: node scripts/test-floofgens-target.js
      - name: Exercise floofgens.net API response fixtures
        run: bun run scripts/test-floofgens-api-fixture.mjs
      - name: Typecheck and lint
        run: |
          bun run eslint
          bun run typescript
      - name: Compile script
        run: |
          bun run browserify
          bun run minify
          bun run template
      - name: Compile stylesheet
        run: |
          bun run sass:prod
          bun run autoprefixer
      - name: Build userscript
        run: bun run compose-userscript:prod
      - name: Assert generated artifact
        run: |
          test -s build/userscript/script.user.js
          grep -q 'reFloofgens' build/userscript/script.user.js
          test -s build/userscript/script.meta.js
          grep -Fq "releases/download/$GIT_TAG_NAME/script.meta.js" build/userscript/script.user.js
          grep -Fq "releases/download/$GIT_TAG_NAME/script.user.js" build/userscript/script.user.js
          grep -Fq "floofgens.net/*" build/userscript/script.meta.js
          grep -Fq "1.3.0-beta.1" build/userscript/script.meta.js
          ! grep -Fq "blep.art/*" build/userscript/script.meta.js
          ! grep -Fq "@match          https://e6ai.net" build/userscript/script.meta.js
      - name: Upload test artifact
        uses: actions/upload-artifact@v4
        with:
          name: refloofgens-test
          path: build/userscript/script.user.js
          retention-days: 7
